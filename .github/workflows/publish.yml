name: Publish to npm

# Publishes the package whenever a GitHub Release is published, using npm
# Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
#
# One-time setup on npmjs.com (package → Settings → Trusted Publishing):
#   Provider:   GitHub Actions
#   Owner:      Naveen2070
#   Repository: project_crucible
#   Workflow:   publish.yml
#   (Environment: leave blank, or set one and add `environment:` below to match.)
#
# Then: bump package.json version → commit/push to the default branch →
# create a GitHub Release with a tag that matches the version (e.g. v1.1.0).

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing requires npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json: $PKG_VERSION   |   release tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$PKG_VERSION'."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx vitest run

      - name: E2E tests
        run: npm run test:e2e

      # No NODE_AUTH_TOKEN: npm authenticates via OIDC against the trusted
      # publisher you configured on npmjs.com. Provenance is attached automatically.
      - name: Publish to npm
        run: npm publish --access public
